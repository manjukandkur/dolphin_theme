{% raw %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolphin — Export Documents &amp; Shipments</title>
<style>
:root{--navy:#0F2540;--gold:#D4A24A;--ink:#1c2430;--muted:#5f6b7a;--line:#e7ebf1;--bg:#eef1f6;--green:#0f6e56;--blue:#185fa5;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1120px;margin:0 auto;padding:18px;}
.topbar{background:var(--navy);border-radius:14px 14px 0 0;padding:15px 20px 0;color:#fff;}
.topbar .row1{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.topbar .title{font-size:18px;font-weight:700;}
.topbar .sub{font-size:12.5px;color:#bcd0e6;margin-top:2px;}
.rolechip{background:#17324f;color:#bcd0e6;font-size:11.5px;padding:5px 12px;border-radius:20px;}
.tabs{display:flex;gap:4px;margin-top:12px;}
.tab{color:#bcd0e6;font-size:13px;padding:9px 18px;cursor:pointer;border-radius:10px 10px 0 0;}
.tab.on{background:var(--bg);color:var(--navy);font-weight:600;}
.tab .b{font-size:10px;padding:0 6px;border-radius:8px;margin-left:4px;background:#17324f;color:#9fe1cb;}
.tab.on .b{background:#378add;color:#fff;}
.panewrap{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:14px;}
.sbx{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
.sbx input{flex:1;height:38px;border:2px solid #185fa5;background:#eef5fc;border-radius:9px;padding:0 12px;font-size:14px;color:#0c2b4a;font-weight:600;}
.tot{font-size:12px;color:var(--muted);white-space:nowrap;font-weight:600;}
.lot{border:1px solid var(--line);border-radius:0 10px 10px 0;margin-bottom:7px;overflow:hidden;background:#fff;border-left:4px solid #b4b2a9;}
.lot.ready{border-left-color:#378add;} .lot.draft{border-left-color:#b4b2a9;} .lot.ship{border-left-color:#0f6e56;background:#f9fdfb;}
.lhead{display:flex;align-items:center;gap:9px;padding:11px 14px;flex-wrap:wrap;}
.lhead.exp{cursor:pointer;}
.chev{color:#8a929c;display:inline-flex;transition:transform .15s;}
.lot.open .chev{transform:rotate(90deg);}
.lname{font-weight:700;} .lsub{font-size:12px;color:var(--muted);}
.pill{font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px;white-space:nowrap;}
.pill.ship{background:#e1f5ee;color:#0f6e56;} .pill.ready{background:#e6f1fb;color:#0c447c;} .pill.draft{background:#f1efe8;color:#5f5e5a;}
.bc{font-size:12px;color:var(--muted);white-space:nowrap;}
.eye{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 8px;border-radius:11px;text-decoration:none;white-space:nowrap;}
.eye.pl{border:1px solid #0f6e56;color:#0f6e56;} .eye.inv{border:1px solid #185fa5;color:#185fa5;} .eye.sd{border:1px solid #8a929c;color:#5f6b7a;}
.det{display:none;border-top:1px solid #eef1f5;padding:14px;background:#fff;}
.lot.open .det{display:block;}
.h6{font-size:11px;font-weight:800;color:#8a929c;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;}
table.blk{width:100%;border-collapse:collapse;font-size:12.5px;}
table.blk td{padding:6px 4px;border-bottom:1px solid #f2f4f7;}
.act{display:inline-block;background:#fff;border:1px solid var(--gold);color:var(--navy);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;text-decoration:none;margin-top:10px;}
.empty{padding:26px;text-align:center;color:#9aa3ad;}
.loadn{background:#fffdf6;border:1px solid #f1d99a;border-left:4px solid var(--gold);border-radius:10px;padding:11px 14px;font-size:12.6px;color:#6b5320;margin:0 0 14px;}
</style>
</head>
<body>
<div class="wrap">
<div id="shell" style="display:none">
  <div class="topbar">
    <div class="row1">
      <div><div class="title">Export Documents &amp; Shipments</div><div class="sub">Dolphin International · active lots and exported shipments with their documents</div></div>
      <div class="rolechip" id="rolechip">…</div>
    </div>
    <div class="tabs">
      <div class="tab on" data-t="active" id="tab-active">Active <span class="b" id="cnt-active">0</span></div>
      <div class="tab" data-t="exported" id="tab-exported">Exported <span class="b" id="cnt-exported">0</span></div>
    </div>
  </div>
  <div class="panewrap">
    <div class="sbx"><input id="q" placeholder="Search lot / consignee / mark / block / vessel"><span class="tot" id="tot"></span></div>
    <div id="list"></div>
  </div>
</div>
<div class="loadn" id="loadNote">Loading export shipment lots…</div>
</div>
<script>
var BANGALORE_ROLES=['System Manager','Administrator','Dolphin Bangalore','Dolphin Owner'];
var isBangalore=false, ALL=[], CONS={}, blockCache={}, curTab='active';
function api(p){return fetch('/api/method/'+p,{headers:{Accept:'application/json'},credentials:'same-origin'}).then(function(r){return r.json();});}
function esc(s){return (s==null?'':(''+s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pdf(dt,nm,fmt){var kind=fmt==='DI Commercial Invoice'?'invoice':'packing_list';return '/api/method/dolphin_theme.shipment_hub.get_export_pdf?shipping_document='+encodeURIComponent(nm)+'&kind='+kind;}
function fmtDate(d){if(!d)return '—';var p=(''+d).split('-');return p.length===3?(p[2]+'-'+p[1]+'-'+p[0]):d;}
function num(v){return (v==null||v==='')?'—':v;}
function consName(code){return (code&&CONS[code])?CONS[code]:(code||'');}
function isShip(l){return l.status==='Shipped';}

function eyesHTML(l){
  var sd=l.shipping_document; if(!sd) return '<span class="lsub">no SD</span>';
  var h='<a class="eye pl" href="'+pdf('Shipping Document',sd,'DI Packing List')+'" target="_blank">&#128065; PL</a>';
  if(isBangalore){
    h='<a class="eye sd" href="/app/shipping-document/'+encodeURIComponent(sd)+'" target="_blank">&#128065; SD</a> '
      +'<a class="eye inv" href="'+pdf('Shipping Document',sd,'DI Commercial Invoice')+'" target="_blank">&#128065; Inv</a> '+h;
  }
  return h;
}
function blocksHTML(rows){
  if(!rows||!rows.length) return '<div class="lsub">No blocks on this lot.</div>';
  return '<table class="blk"><tbody>'+rows.map(function(b){
    var dim=num(b.length)+'&times;'+num(b.width)+'&times;'+num(b.height);
    return '<tr><td style="font-weight:600">'+esc(b.block_no||b.block||'—')+'</td><td class="lsub">'+(b.export_block_no?('exp '+esc(b.export_block_no)):'')+'</td><td class="lsub">'+dim+'</td><td class="lsub">'+(b.grade?esc(b.grade):'')+'</td></tr>';
  }).join('')+'</tbody></table>';
}
function detailHTML(l,blocks){
  return '<div class="h6">Blocks ('+(l.block_count||(blocks?blocks.length:0)||0)+')</div>'+blocksHTML(blocks)
    +'<a class="act" href="/app/export-shipment-lot/'+encodeURIComponent(l.name)+'" target="_blank">Open lot &middot; return blocks / reopen to At Port</a>';
}
function lotHTML(l,i,exported){
  var title=l.lot_title||l.name;
  var sub=[consName(l.export_consignee), l.vessel, (l.bl_no?('BL '+l.bl_no):''), (exported?('shipped '+fmtDate(l.shipment_date)):null)].filter(Boolean).map(esc).join(' · ');
  var pill=exported?'<span class="pill ship">&#128666; Shipped</span>':(l.status==='Ready'?'<span class="pill ready">&#9679; Ready</span>':'<span class="pill draft">&#9679; Draft</span>');
  var cls=exported?'ship':(l.status==='Ready'?'ready':'draft');
  var head='<div class="lhead'+(exported?' exp':'')+'">'+(exported?'<span class="chev">&#9656;</span>':'')
    +'<div style="flex:1;min-width:180px"><div class="lname">'+esc(title)+' <span class="lsub">'+esc(l.name)+'</span></div><div class="lsub">'+sub+'</div></div>'
    +(exported?('<span style="display:flex;gap:5px;align-items:center">'+eyesHTML(l)+'</span>'):'')
    +pill+'<span class="bc">'+(l.block_count||0)+' blk</span></div>';
  return '<div class="lot '+cls+'" data-i="'+i+'">'+head+(exported?'<div class="det"><div class="lsub">Loading…</div></div>':'')+'</div>';
}
function currentList(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var arr=ALL.filter(function(l){return curTab==='exported'?isShip(l):!isShip(l);});
  if(q) arr=arr.filter(function(l){return [l.name,l.lot_title,consName(l.export_consignee),l.vessel,l.bl_no,l.shipping_mark,l.shipping_document].filter(Boolean).join(' ').toLowerCase().indexOf(q)>=0;});
  return arr;
}
function render(){
  var exported=curTab==='exported';
  var list=currentList();
  var el=document.getElementById('list');
  var blocks=list.reduce(function(s,l){return s+(l.block_count||0);},0);
  var cbm=list.reduce(function(s,l){return s+(+l.total_cbm||0);},0);
  document.getElementById('tot').textContent=list.length+' lots · '+blocks+' blocks'+(cbm?(' · '+cbm.toFixed(0)+' CBM'):'');
  if(!list.length){el.innerHTML='<div class="empty">No '+(exported?'exported':'active')+' lots'+((document.getElementById('q').value||'').trim()?' match your search':'')+'.</div>';return;}
  el.innerHTML=list.map(function(l){return lotHTML(l, ALL.indexOf(l), exported);}).join('');
  if(exported){
    Array.prototype.forEach.call(el.querySelectorAll('.lot'),function(row){
      row.querySelector('.lhead').addEventListener('click',function(ev){
        if(ev.target.closest('a')) return;
        var open=row.classList.toggle('open');
        if(open) loadDetail(+row.getAttribute('data-i'), row.querySelector('.det'));
      });
    });
  }
}
function loadDetail(i,det){
  var l=ALL[i];
  if(blockCache[l.name]){det.innerHTML=detailHTML(l,blockCache[l.name]);return;}
  api('frappe.client.get?doctype=Export Shipment Lot&name='+encodeURIComponent(l.name)).then(function(j){
    var doc=j.message||{};var blocks=doc.blocks||[];blockCache[l.name]=blocks;det.innerHTML=detailHTML(l,blocks);
  }).catch(function(){det.innerHTML=detailHTML(l,[]);});
}
function setTab(t){
  curTab=t;
  document.getElementById('tab-active').classList.toggle('on',t==='active');
  document.getElementById('tab-exported').classList.toggle('on',t==='exported');
  render();
}

(async function(){
  try{
    var user=await api('frappe.auth.get_logged_user').then(function(j){return j.message;});
    if(!user||user==='Guest'){document.getElementById('loadNote').textContent='Please sign in to view export documents.';return;}
    var rp=new URLSearchParams({doctype:'Has Role',filters:JSON.stringify([['parenttype','=','User'],['parent','=',user]]),fields:JSON.stringify(['role']),limit_page_length:0});
    var roles=await api('frappe.client.get_list?'+rp.toString()).then(function(j){return (j.message||[]).map(function(r){return r.role;});});
    isBangalore=roles.some(function(r){return BANGALORE_ROLES.indexOf(r)>=0;});
    document.getElementById('rolechip').textContent=isBangalore?'Bangalore · invoice + SD visible':'Ilkal · packing list only';

    var lp=new URLSearchParams({doctype:'Export Shipment Lot',fields:JSON.stringify(['name','lot_title','export_consignee','status','vessel','bl_no','shipping_document','shipment_date','block_count','shipping_mark','total_cbm']),order_by:'modified desc',limit_page_length:0});
    ALL=await api('frappe.client.get_list?'+lp.toString()).then(function(j){return j.message||[];});

    var codes=[]; ALL.forEach(function(l){if(l.export_consignee && codes.indexOf(l.export_consignee)<0)codes.push(l.export_consignee);});
    if(codes.length){
      var cp=new URLSearchParams({doctype:'Export Consignee',filters:JSON.stringify([['name','in',codes]]),fields:JSON.stringify(['name','company_name','nick_name']),limit_page_length:0});
      var cl=await api('frappe.client.get_list?'+cp.toString()).then(function(j){return j.message||[];}).catch(function(){return [];});
      cl.forEach(function(c){CONS[c.name]=c.company_name||c.nick_name||c.name;});
    }
    document.getElementById('cnt-active').textContent=ALL.filter(function(l){return !isShip(l);}).length;
    document.getElementById('cnt-exported').textContent=ALL.filter(isShip).length;

    document.getElementById('loadNote').style.display='none';
    document.getElementById('shell').style.display='';
    document.getElementById('tab-active').addEventListener('click',function(){setTab('active');});
    document.getElementById('tab-exported').addEventListener('click',function(){setTab('exported');});
    var t=null;document.getElementById('q').addEventListener('input',function(){clearTimeout(t);t=setTimeout(render,250);});
    render();
  }catch(e){document.getElementById('loadNote').textContent='Could not load ('+((e&&e.message)||e)+'). Open while logged in to ERPNext.';}
})();
</script>
</body>
</html>{% endraw %}
