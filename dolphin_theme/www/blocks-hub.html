{% raw %}
<!--
  Dolphin — Blocks hub.  Rebuilt 17 Aug 2026.

  This one page replaces two.  B5: "suggest something to combine both the pages
  into one I mean Block summary and overview and journey".

  Also carries:
    B2  every occurrence of a number, never just the first
    B3  dates on the journey and in the tables, with an age chip
    B4  export number loud everywhere, never a grey caption
    B6  the trace field in theme blue, sized consistently
    B27 …and specifically the FILLED DARK NAVY field, like the theme's own
    B29 the eye opens a preview in place, it does not download a PDF
    B34 a removal reason follows the block and shows up here
-->
<style>
#bh{font-family:inherit;max-width:1520px;margin:0 auto;padding:8px 12px;color:#1f2a3a;zoom:1.12}
#bh .hd{background:#16304F;color:#fff;border-radius:12px 12px 0 0;padding:12px 18px;display:flex;align-items:center;gap:14px;border-bottom:2px solid #2490ef;flex-wrap:wrap}
#bh .hd .di{width:26px;height:26px;border-radius:50%;background:#D4A24A;color:#16304F;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
#bh .hd h1{font-size:18px;margin:0;font-weight:600}
#bh .chip{font-size:11px;padding:3px 11px;border-radius:12px;background:#2490ef;color:#fff}
#bh .rb{font-size:12px;padding:5px 11px;border-radius:8px;background:#fff;border:1px solid #cfd4dc;color:#1f2a3a;cursor:pointer}

/* B6 + B27 — the trace box.  Filled dark navy with the gold hairline, exactly
   like the theme's own "Trace block no…" field in the top bar, so the pattern
   continues and it is recognised without being read.  Same height as the header
   chips; it does not balloon on this page the way the mockup's did. */
#bh .tracewrap{margin-left:auto;position:relative;min-width:260px}
#bh .tracebox{display:flex;align-items:center;gap:7px;background:#0F2540;border:1px solid #D4A24A;border-radius:8px;padding:6px 10px;height:32px;box-sizing:border-box}
#bh .tracebox span.ic{color:#D4A24A;font-size:13px;line-height:1}
#bh #bh-trace{border:none;background:transparent;color:#fff;font-size:13px;width:100%;outline:none;padding:0;height:auto;box-shadow:none}
#bh #bh-trace::placeholder{color:#8fa6c4}
#bh .tracewrap .dd{display:none;position:absolute;left:0;right:0;top:38px;z-index:60;background:#fff;border:1px solid #cfd4dc;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-height:320px;overflow:auto}
#bh .tracewrap .dd .r{padding:7px 11px;font-size:12px;cursor:pointer;border-bottom:.5px solid #eef2f6;color:#1f2a3a}
#bh .tracewrap .dd .r:hover{background:#e6f1fb}

#bh .tabs{display:flex;gap:2px;background:#24507E;padding:0 10px;overflow-x:auto}
#bh .tab{padding:10px 11px;color:#cdd8e8;font-size:12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
#bh .tab.on{color:#fff;font-weight:600;border-bottom-color:#D4A24A}
#bh .tab b{color:#D4A24A}
#bh .ctx{background:#e6f1fb;padding:0}
#bh .flt{background:#f7fbff;padding:9px 14px;border-bottom:.5px solid #d6e6f5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px}
#bh select,#bh input{font-size:12px;padding:3px 6px;border:.5px solid #b5d4f4;border-radius:6px}
#bh input.n{width:44px;text-align:center;padding:3px 4px}
#bh .pane{border:.5px solid #d6e6f5;border-top:none;background:#fff;min-height:340px;position:relative}
#bh .tcards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:12px 14px}
#bh .tcard{background:#e6f1fb;border-radius:9px;padding:10px}
#bh .tcard .v{font-size:21px;font-weight:700;color:#0c447c;line-height:1.1}
#bh .tcard .l{font-size:10px;color:#5f6b7a;margin-top:2px}
#bh table.gs{width:100%;border-collapse:collapse;font-size:12px}
#bh table.gs th{background:#e6f1fb;color:#0c447c;font-size:10px;text-transform:uppercase;padding:6px 12px;text-align:right}
#bh table.gs th:first-child{text-align:left}
#bh table.gs td{padding:6px 12px;text-align:right;border-top:.5px solid #eef2f6}
#bh table.gs td:first-child{text-align:left;font-weight:600}
#bh .cell{cursor:pointer;color:#185fa5}#bh .cell:hover{background:#e6f1fb}
#bh .brow{display:flex;align-items:center;padding:7px 14px;border-bottom:.5px solid #eef2f6;font-size:12.5px;gap:6px}
#bh .brow:hover{background:#f4f9ff}
#bh .mini{font-size:11px;border:1px solid #85b7eb;color:#185fa5;border-radius:9px;padding:2px 9px;cursor:pointer;white-space:nowrap}
#bh .mini:hover{background:#e6f1fb}
#bh .sheet{display:none;position:absolute;inset:0;background:rgba(15,36,68,.5);z-index:30}
#bh .sheet .box{position:absolute;top:0;right:0;bottom:0;width:56%;min-width:360px;background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.22);overflow:auto;padding:15px 18px}
#bh .stt{padding:7px 14px;cursor:pointer;font-size:12px;color:#5f6b7a;border-bottom:2px solid transparent}
#bh .stt.on{color:#0c447c;font-weight:600;border-bottom-color:#2490ef}
#bh .note{border-left:3px solid #2490ef;background:#f4f9ff;border-radius:0 6px 6px 0;padding:6px 9px;margin-bottom:6px}
#bh .muted{color:#8a929c}

/* B4 — the export number.  It was a grey caption and Manjunath read past it two
   or three times.  It is now the loudest thing in any row that has one. */
#bh .exp{font-weight:800;font-size:14px;color:#0F2540;letter-spacing:.2px}
#bh .exp .tag{font-weight:700;font-size:9px;color:#8a6a1f;background:#fdf2dc;border:1px solid #ecd7a6;border-radius:4px;padding:1px 4px;margin-right:5px;vertical-align:2px;letter-spacing:.4px}
#bh .qno{font-size:11.5px;color:#5f6b7a}

/* B3 — age chips.  Green = this month, amber = this quarter, grey = older. */
#bh .age{font-size:10px;padding:1px 7px;border-radius:9px;margin-left:6px;white-space:nowrap}
#bh .age.new{background:#e6f5e6;color:#2c6b2f}
#bh .age.mid{background:#fdf2dc;color:#8a6a1f}
#bh .age.old{background:#eef0f3;color:#5f6b7a}

#bh .warn{background:#fdf3f3;border:1px solid #f0c9c9;color:#a32d2d;border-radius:9px;padding:9px 12px;font-size:12px;margin:12px 14px}
#bh .info{background:#eef6ff;border:1px solid #cfe3f8;color:#12456f;border-radius:9px;padding:9px 12px;font-size:12px;margin:12px 14px}
#bh .occ{border:1px solid #cfd4dc;border-radius:11px;overflow:hidden;margin:0 14px 14px}
#bh .occ .top{background:#0F2540;color:#fff;padding:9px 13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#bh .occ .top .via{font-size:10px;background:#2490ef;border-radius:9px;padding:2px 8px}
#bh .occ .top .via.bad{background:#a32d2d}
#bh .jrow{display:flex;gap:0;padding:14px 13px 6px;overflow-x:auto}
#bh .jn{min-width:132px;flex:1;position:relative;padding-right:8px}
#bh .jn .dot{width:13px;height:13px;border-radius:50%;background:#cfd4dc;position:relative;z-index:2}
#bh .jn .bar{position:absolute;left:13px;right:0;top:6px;height:2px;background:#e0e6ee}
#bh .jn.done .dot{background:#2490ef}
#bh .jn.done .bar{background:#9dc7ee}
#bh .jn .lb{font-size:11px;font-weight:600;margin-top:7px}
#bh .jn .dt{font-size:11px;color:#5f6b7a}
#bh .evt{font-size:11.5px;padding:7px 13px;border-top:.5px solid #eef2f6;display:flex;gap:8px;align-items:flex-start}
#bh .evt .k{font-weight:700;border-radius:5px;padding:1px 6px;font-size:10px;white-space:nowrap}
#bh .evt .k.trash{background:#fdecec;color:#a32d2d}
#bh .evt .k.skip{background:#fdf2dc;color:#8a6a1f}
#bh .evt .k.reverse{background:#eef0ff;color:#3c3489}
#bh .evt .k.note{background:#eef6ff;color:#12456f}

/* B29 — the preview.  Opens here, over the page.  Nothing downloads. */
#bh-modal{display:none;position:fixed;inset:0;background:rgba(15,36,68,.62);z-index:9999}
#bh-modal .win{position:absolute;top:3vh;left:50%;transform:translateX(-50%);width:min(1000px,94vw);height:94vh;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column}
#bh-modal .wh{background:#16304F;color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:13px}
#bh-modal .wh .sp{flex:1}
#bh-modal .wb{flex:1;background:#f4f6f9}
#bh-modal iframe{width:100%;height:100%;border:none;background:#fff}
</style>

<div id="bh">
  <div class="hd">
    <div class="di">DI</div>
    <h1>Blocks &mdash; summary, journey and trace</h1>
    <span class="chip" id="bh-asof">&mdash;</span>
    <span class="rb" id="bh-reload">&#8635; Reload</span>
    <div class="tracewrap">
      <div class="tracebox"><span class="ic">&#128269;</span><input id="bh-trace" placeholder="Trace block no&hellip;" autocomplete="off"></div>
      <div class="dd" id="bh-dd"></div>
    </div>
  </div>
  <div class="tabs" id="bh-tabs"></div>
  <div class="ctx" id="bh-ctx"></div>
  <div class="flt" id="bh-flt">
    <span style="color:#0c447c;font-weight:600">&#9776; Filters</span>
    <span>Grade <select id="bh-grade"><option value="">all</option></select></span>
    <span>Produced <input type="date" id="bh-from"> &rarr; <input type="date" id="bh-to"></span>
    <span>Size <select id="bh-mode"><option value="ge">&ge;</option><option value="lt">smaller</option></select> <input class="n" id="bh-L" value="180">&times;<input class="n" id="bh-W" value="100">&times;<input class="n" id="bh-H" value="60"></span>
    <span>&#128269; <input id="bh-q" placeholder="block / export" style="width:130px"></span>
    <span class="muted" style="margin-left:auto;font-style:italic">applies to the stock tabs</span>
  </div>
  <div class="pane" id="bh-pane"><div style="padding:40px;text-align:center;color:#8a929c">Loading blocks&hellip;</div><div class="sheet" id="bh-sheet"></div></div>
</div>

<div id="bh-modal"><div class="win"><div class="wh"><span id="bh-mt">Preview</span><span class="sp"></span><span class="rb" id="bh-mnew" title="Open full screen">&#8599; Full page</span><span class="rb" id="bh-mx">&#10005; Close</span></div><div class="wb"><iframe id="bh-mf"></iframe></div></div></div>

<script>
var TOKEN=null,DATA=[],ST={tab:'all',ctx:'',drill:null},TRACE=null,TQ='';
function $(id){return document.getElementById(id);}
function esc(s){return (s==null?'':(''+s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function f(n,d){d=d==null?2:d;n=+n||0;return (Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);}
function dm(s){return s?(''+s).slice(0,10).split('-').reverse().join('-'):'';}
function post(m,a){return fetch('/api/method/'+m,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','X-Frappe-CSRF-Token':TOKEN},body:JSON.stringify(a)}).then(function(r){return r.json();});}
function get(m,qs){return fetch('/api/method/'+m+(qs?('?'+qs):''),{credentials:'include'}).then(function(r){return r.json();});}

/* ---- B3: how old is this, in one glance ---- */
function ageChip(days){
  if(days==null) return '';
  var cls = days<=30?'new':(days<=120?'mid':'old');
  var txt = days<=0?'today':(days===1?'1 day':(days<45?(days+' days'):(days<400?(Math.round(days/30)+' mo'):(Math.round(days/365)+' yr'))));
  return '<span class="age '+cls+'">'+txt+'</span>';
}
/* ---- B4: the export number, said out loud ---- */
function expHtml(exp,qno){
  if(exp) return '<span class="exp"><span class="tag">EXP</span>'+esc(exp)+'</span>'+(qno?(' <span class="qno">quarry '+esc(qno)+'</span>'):'');
  return '<span class="exp" style="color:#a32d2d"><span class="tag" style="background:#fdecec;border-color:#f0c9c9;color:#a32d2d">NO EXP</span>'+esc(qno||'&mdash;')+'</span>';
}

/* ---- B29: the eye opens a preview here, in place ---- */
function preview(doctype,name,title){
  if(!doctype||!name) return;
  var m=$('bh-modal');
  var url='/printview?doctype='+encodeURIComponent(doctype)+'&name='+encodeURIComponent(name)+'&trigger_print=0&no_letterhead=0';
  $('bh-mt').textContent=(title||(doctype+' · '+name));
  $('bh-mf').src=url;
  m.style.display='block';
  $('bh-mnew').onclick=function(){try{(window.top||window).open('/app/'+doctype.toLowerCase().replace(/ /g,'-')+'/'+encodeURIComponent(name),'_blank');}catch(e){window.open(url,'_blank');}};
}
$('bh-mx').onclick=function(){$('bh-modal').style.display='none';$('bh-mf').src='about:blank';};
$('bh-modal').onclick=function(ev){if(ev.target===$('bh-modal')){$('bh-mx').onclick();}};
function eye(doctype,name,label){
  if(!name) return '';
  return '<span class="mini" data-pv="'+esc(doctype)+'|'+esc(name)+'">&#128065; '+esc(label||name)+'</span>';
}
function wireEyes(root){
  Array.prototype.forEach.call((root||document).querySelectorAll('[data-pv]'),function(el){
    el.onclick=function(){var p=el.dataset.pv.split('|');preview(p[0],p[1]);};});
}

var GF={};
var STAGES=[['all','All','&#9707;'],['instock','In stock','&#128230;'],['bi','Buyer marked','&#128100;'],['dc','In DC','&#128196;'],['port','At port','&#9875;'],['shipped','Shipped','&#128674;'],['dup','Duplicates','&#128203;'],['trace','Trace &amp; journey','&#128270;'],['notes','Notes &amp; removals','&#128221;']];
function thr(){return {L:+$('bh-L').value||0,W:+$('bh-W').value||0,H:+$('bh-H').value||0,mode:$('bh-mode').value};}
function big(b,t){return b.L>=t.L&&b.W>=t.W&&b.H>=t.H;}
function dupCount(){var c={};DATA.forEach(function(b){if(b.block)c[b.block]=(c[b.block]||0)+1;});return c;}
function uniq(a){var o=[];a.forEach(function(x){if(x&&o.indexOf(x)<0)o.push(x);});return o.sort();}
function base(){var q=($('bh-q').value||'').toLowerCase(),from=$('bh-from').value,to=$('bh-to').value,g=$('bh-grade').value,dc=dupCount();
  return DATA.filter(function(b){
    if(ST.tab==='dup'){if(dc[b.block]<2)return false;}else if(ST.tab!=='all'&&b.stage!==ST.tab)return false;
    if(ST.tab==='bi'&&ST.ctx&&b.bi!==ST.ctx)return false;
    if(ST.tab==='dc'&&ST.ctx&&b.dc!==ST.ctx)return false;
    if(g&&b.grade!==g)return false;
    if(from&&b.produced&&b.produced<from)return false; if(to&&b.produced&&b.produced>to)return false;
    if(q&&(b.block+' '+b.exp).toLowerCase().indexOf(q)<0)return false; return true;});}
function sums(a){var c=0,m=0,n=0;a.forEach(function(b){c+=+b.cbm||0;m+=+b.mt||0;n+=+b.net||0;});return {n:a.length,cbm:c,mt:m,net:n};}
function totBar(s){return [[s.n,'Blocks'],[f(s.cbm),'&Sigma; Gross volume CBM'],[f(s.mt),'&Sigma; Gross tonnage MT'],[f(s.net),'&Sigma; Net tonnage MT']].map(function(c){return '<div class="tcard"><div class="v">'+c[0]+'</div><div class="l">'+c[1]+'</div></div>';}).join('');}
function tabs(){var dc=dupCount();var nd=Object.keys(dc).filter(function(k){return dc[k]>1;}).length;
  $('bh-tabs').innerHTML=STAGES.map(function(s){
    var n='';
    if(s[0]==='all')n=DATA.length; else if(s[0]==='dup')n=nd;
    else if(s[0]==='trace'||s[0]==='notes')n='';
    else n=DATA.filter(function(b){return b.stage===s[0];}).length;
    return '<span class="tab '+(ST.tab===s[0]?'on':'')+'" data-t="'+s[0]+'">'+s[2]+' '+s[1]+(n===''?'':(' <b>'+n+'</b>'))+'</span>';}).join('');
  Array.prototype.forEach.call($('bh-tabs').children,function(el){el.onclick=function(){ST.tab=el.dataset.t;ST.ctx='';ST.drill=null;render();};});}
function ctxBar(){var slot=$('bh-ctx');
  if(ST.tab==='bi'){var bis=uniq(DATA.filter(function(b){return b.stage==='bi';}).map(function(b){return b.bi;}));
    slot.style.padding='8px 14px';slot.innerHTML='<span style="font-size:11px;color:#0c447c;font-weight:600">&#128100; Buyer Inspection</span> <select id="bh-bi"><option value="">All BIs ('+bis.length+')</option>'+bis.map(function(x){return '<option '+(x===ST.ctx?'selected':'')+'>'+esc(x)+'</option>';}).join('')+'</select>';
    $('bh-bi').onchange=function(){ST.ctx=this.value;ST.drill=null;render();};}
  else if(ST.tab==='dc'){var dcs=uniq(DATA.filter(function(b){return b.stage==='dc';}).map(function(b){return b.dc;}));
    slot.style.padding='8px 14px';slot.innerHTML='<span style="font-size:11px;color:#0c447c;font-weight:600">&#128196; Delivery Challan</span> <select id="bh-dc"><option value="">All DCs ('+dcs.length+')</option>'+dcs.map(function(x){return '<option '+(x===ST.ctx?'selected':'')+'>'+esc(x)+'</option>';}).join('')+'</select>';
    $('bh-dc').onchange=function(){ST.ctx=this.value;ST.drill=null;render();};}
  else{slot.style.padding='0';slot.innerHTML='';}}

function summary(){var bs=base(),t=thr();
  var gs=uniq(DATA.map(function(b){return b.grade;})).filter(Boolean).map(function(g){var arr=bs.filter(function(b){return b.grade===g;});return {g:g,arr:arr,b1:arr.filter(function(b){return big(b,t);}).length,sm:arr.filter(function(b){return !big(b,t);}).length};});
  var h='<div class="tcards">'+totBar(sums(bs))+'</div><div style="font-size:11px;color:#0c447c;font-weight:600;padding:0 14px 5px">Grade &times; size &mdash; tap any number to expand</div><div style="padding:0 14px 14px"><table class="gs"><thead><tr><th>Grade</th><th>&ge; '+t.L+'&times;'+t.W+'&times;'+t.H+'</th><th>smaller</th><th>total</th><th>&Sigma; MT</th></tr></thead><tbody>'
    +gs.map(function(r){return '<tr><td>'+esc(r.g)+'</td><td class="cell" data-g="'+esc(r.g)+'" data-b="ge">'+r.b1+'</td><td class="cell" data-g="'+esc(r.g)+'" data-b="lt">'+r.sm+'</td><td class="cell" data-g="'+esc(r.g)+'" data-b="all">'+r.arr.length+'</td><td>'+f(sums(r.arr).mt)+'</td></tr>';}).join('')
    +(gs.length?'':'<tr><td colspan="5" class="muted" style="text-align:center;padding:16px">No blocks match the filters.</td></tr>')+'</tbody></table></div>';
  setPane(h);
  Array.prototype.forEach.call($('bh-pane').querySelectorAll('.cell'),function(el){el.onclick=function(){ST.drill={g:el.dataset.g,b:el.dataset.b};render();};});}

function drillList(){var bs=base(),t=thr(),d=ST.drill;var arr=bs.filter(function(b){if(d.g&&b.grade!==d.g)return false;if(d.b==='ge'&&!big(b,t))return false;if(d.b==='lt'&&big(b,t))return false;return true;});
  var title=(d.g?('Grade '+esc(d.g)):'All')+' &middot; '+(d.b==='ge'?('&ge; '+t.L+'&times;'+t.W+'&times;'+t.H):d.b==='lt'?'smaller':'all sizes')+(ST.ctx?(' &middot; '+esc(ST.ctx)):'');
  var h='<div style="padding:11px 14px"><div style="display:flex;align-items:center;gap:9px;margin-bottom:9px"><span class="mini" id="bh-back">&larr; Summary</span><span style="font-size:13px;font-weight:600">'+title+'</span></div><div class="tcards" style="padding:0;margin-bottom:10px">'+totBar(sums(arr))+'</div><div style="border:.5px solid #d6e6f5;border-radius:9px;overflow:hidden;max-height:340px;overflow:auto">'
    +'<div class="brow" style="background:#f6f9fd;color:#0c447c;font-size:10px;text-transform:uppercase"><span style="flex:1">Block</span><span style="width:96px">Size</span><span style="width:86px">Produced</span><span style="width:52px;text-align:right">MT</span><span style="width:70px"></span></div>'
    +(arr.length?arr.map(function(b){return '<div class="brow"><div style="flex:1">'+expHtml(b.exp,b.block)+' <span class="qno">&middot; '+esc(b.grade)+'</span></div><span style="width:96px;font-size:11px">'+b.L+'&times;'+b.W+'&times;'+b.H+'</span><span style="width:86px;font-size:11px">'+dm(b.produced)+'</span><span style="width:52px;text-align:right">'+f(b.mt,1)+'</span><span style="width:70px;text-align:right"><span class="mini" data-eye="'+esc(b.name)+'">&#128065;</span></span></div>';}).join(''):'<div class="brow muted" style="padding:16px;justify-content:center">No blocks.</div>')
    +'</div></div>';
  setPane(h);
  $('bh-back').onclick=function(){ST.drill=null;render();};
  Array.prototype.forEach.call($('bh-pane').querySelectorAll('[data-eye]'),function(el){el.onclick=function(){openSheet(el.dataset.eye);};});}

function dupView(){var dc=dupCount();var keys=Object.keys(dc).filter(function(k){return dc[k]>1;});
  var h='<div style="padding:12px 14px"><div style="font-size:12px;color:#5f6b7a;margin-bottom:10px">'+keys.length+' block number(s) used by more than one record. Review and remove the wrong one.</div>';
  keys.forEach(function(k){var recs=DATA.filter(function(b){return b.block===k;});
    h+='<div style="border:.5px solid #cfd4dc;border-radius:10px;overflow:hidden;margin-bottom:10px"><div style="background:#fdf3f3;color:#a32d2d;font-size:12px;font-weight:600;padding:7px 12px;border-bottom:.5px solid #eee">&#9888; Block number '+esc(k)+' &mdash; '+recs.length+' records</div>'
      +recs.map(function(b){var canDel=!b.dc&&!b.bi;return '<div class="brow"><div style="flex:1">'+expHtml(b.exp,b.block)+' <span class="qno">&middot; pit '+esc(b.pit)+' &middot; '+b.L+'&times;'+b.W+'&times;'+b.H+' &middot; '+esc(b.status)+'</span></div><span class="mini" data-eye="'+esc(b.name)+'">&#128065; View</span> '+(canDel?'<span class="mini" data-del="'+esc(b.name)+'" style="border-color:#e24b4a;color:#a32d2d">&#128465; Remove</span>':'<span class="muted" style="font-size:10px">in BI/DC</span>')+'</div>';}).join('')+'</div>';});
  h+='<div class="muted" style="font-size:11px">Removal is blocked when the block is already in a BI or DC, and always asks for a reason.</div></div>';
  setPane(h);
  Array.prototype.forEach.call($('bh-pane').querySelectorAll('[data-eye]'),function(el){el.onclick=function(){openSheet(el.dataset.eye);};});
  Array.prototype.forEach.call($('bh-pane').querySelectorAll('[data-del]'),function(el){el.onclick=function(){
    var why=prompt('Why is this record being removed? The reason stays with the block and shows in Trace.');
    if(!why||why.trim().length<4){if(why!==null)alert('A real reason is needed — a few words at least.');return;}
    post('dolphin_theme.blocks_api.delete_block',{name:el.dataset.del,reason:why}).then(function(j){if(j.message&&j.message.ok){DATA=DATA.filter(function(b){return b.name!==el.dataset.del;});render();}else{alert((j._server_messages||'Could not remove'));}});};});}

/* =====================================================================
   B2 + B3 + B5 — Trace and journey, merged into this page.
   Every occurrence is shown.  The old trace stopped at the first match,
   so with 92 shared numbers the second block was simply invisible.
   ===================================================================== */
function traceView(){
  if(!TQ){setPane('<div class="info">Type a block number in the <b>Trace block no…</b> box at the top right. Every block that answers to that number is shown &mdash; quarry number, export number, all of them.</div>');return;}
  if(TRACE===null){setPane('<div style="padding:40px;text-align:center;color:#8a929c">Tracing '+esc(TQ)+'&hellip;</div>');return;}
  var h='';
  if(TRACE.message){h+='<div class="'+(TRACE.count>1||TRACE.record_id_only?'warn':'info')+'">'+esc(TRACE.message)+'</div>';}
  if(!TRACE.hits||!TRACE.hits.length){h+='<div class="info">Nothing found for <b>'+esc(TQ)+'</b>.</div>';setPane(h);return;}
  TRACE.hits.forEach(function(b,i){
    var viaBad=(b.via==='record-id');
    h+='<div class="occ"><div class="top">'
      +'<span style="font-size:10px;background:#D4A24A;color:#16304F;border-radius:9px;padding:2px 8px;font-weight:700">'+(i+1)+' of '+TRACE.hits.length+'</span>'
      +'<span class="exp" style="color:#fff"><span class="tag">EXP</span>'+esc(b.export_block_no||'—')+'</span>'
      +'<span style="font-size:12px;color:#cdd8e8">quarry '+esc(b.block_number||'—')+' &middot; record '+esc(b.name)+'</span>'
      +'<span class="via'+(viaBad?' bad':'')+'">matched on '+esc(viaBad?'record id — not a real match':b.via)+'</span>'
      +'<span style="margin-left:auto;font-size:12px">'+esc(b.status||'')+ageChip(b.age)+'</span>'
      +'</div>';
    /* the journey, with a date under every node (B3) */
    h+='<div class="jrow">'+b.nodes.map(function(n,j){
        return '<div class="jn '+(n.done?'done':'')+'">'+(j<b.nodes.length-1?'<div class="bar"></div>':'')+'<div class="dot"></div>'
          +'<div class="lb">'+esc(n.label)+'</div>'
          +'<div class="dt">'+(n.done?(dm(n.date)+ageChip(n.age)):'<span class="muted">not yet</span>')+'</div>'
          +(n.doc?('<div style="margin-top:4px">'+eye(n.doctype,n.doc,n.doc)+'</div>'):'')
          +'</div>';}).join('')+'</div>';
    /* every arrival row this block appears on — not just the first */
    if(b.arrivals&&b.arrivals.length){
      h+='<div style="padding:2px 13px 8px"><div style="font-size:11px;color:#0c447c;font-weight:600;margin-bottom:4px">Arrival rows ('+b.arrivals.length+')</div>'
        +b.arrivals.map(function(a){return '<div class="evt"><span class="k '+(a.confirmed?'note':'skip')+'">'+(a.confirmed?'CONFIRMED':'DRAFT')+'</span><span style="flex:1">'+esc(a.arrival)+' &middot; typed <b>'+esc(a.matched_on)+'</b> &middot; '+esc(a.recon_status||'—')+(a.note?(' &middot; <i>'+esc(a.note)+'</i>'):'')+'</span><span class="muted">'+dm(a.date)+'</span></div>';}).join('')+'</div>';
    }
    /* B34 — removals, skips and reversals follow the block and show up here */
    if(b.events&&b.events.length){
      h+='<div style="padding:2px 13px 8px"><div style="font-size:11px;color:#0c447c;font-weight:600;margin-bottom:4px">Recorded events</div>'
        +b.events.map(function(e){
          var kind=(e.tag||'').replace('[DI-','').replace(']','').toLowerCase();
          return '<div class="evt"><span class="k '+esc(kind)+'">'+esc(kind.toUpperCase())+'</span><span style="flex:1">'
            +esc(e.reason||e.restored_reason||'(no reason recorded)')
            +(e.from_name?(' &middot; from '+esc(e.from_name)):'')
            +(e.from&&e.to?(' &middot; '+esc(e.from)+' → '+esc(e.to)):'')
            +'<div class="muted" style="font-size:10.5px">'+esc(e.person||e.by||'')+' &middot; '+esc(e.machine||'un-named device')+'</div></span>'
            +'<span class="muted">'+dm(e.at)+'</span></div>';}).join('')+'</div>';
    }
    if(b.notes&&b.notes.length){
      h+='<div style="padding:2px 13px 10px"><div style="font-size:11px;color:#0c447c;font-weight:600;margin-bottom:4px">Notes</div>'
        +b.notes.slice(0,8).map(function(n){return '<div class="evt"><span class="k note">NOTE</span><span style="flex:1">'+esc(n.t)+'</span><span class="muted">'+dm(n.d)+'</span></div>';}).join('')+'</div>';
    }
    h+='<div style="padding:8px 13px;border-top:.5px solid #eef2f6;display:flex;gap:7px;flex-wrap:wrap">'
      +'<span class="mini" data-eye="'+esc(b.name)+'">&#128065; Open block</span>'
      +(b.dc?eye('Delivery Challan',b.dc,'Challan '+(b.dc_no||b.dc)):'')
      +(b.bi?eye('Buyer Inspection',b.bi,'BI '+b.bi):'')
      +(b.qi?eye('Quarry Inspection',b.qi,'QI '+b.qi):'')
      +'</div></div>';
  });
  setPane(h);
  wireEyes($('bh-pane'));
  Array.prototype.forEach.call($('bh-pane').querySelectorAll('[data-eye]'),function(el){el.onclick=function(){openSheet(el.dataset.eye);};});
}

/* B1/B34 — find blocks carrying a note or a removal reason */
function notesView(){
  setPane('<div style="padding:11px 14px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><span style="font-size:13px;font-weight:600">Blocks carrying a note, a removal or an override</span><input id="nq" placeholder="search note text…" style="width:220px"><span class="mini" id="ngo">Search</span></div><div id="nres"><div class="muted" style="font-size:12px">Searching&hellip;</div></div></div>');
  var run=function(){
    var q=($('nq')&&$('nq').value)||'';
    $('nres').innerHTML='<div class="muted" style="font-size:12px">Searching&hellip;</div>';
    get('dolphin_theme.api_arrivals.find_by_note','q='+encodeURIComponent(q)).then(function(j){
      var rows=j.message||[];
      if(!rows.length){$('nres').innerHTML='<div class="muted" style="font-size:12px">No notes found.</div>';return;}
      $('nres').innerHTML='<div style="border:.5px solid #d6e6f5;border-radius:9px;overflow:hidden;max-height:420px;overflow:auto">'
        +'<div class="brow" style="background:#f6f9fd;color:#0c447c;font-size:10px;text-transform:uppercase"><span style="width:130px">Block</span><span style="flex:1">Note</span><span style="width:150px">Where</span><span style="width:90px">When</span></div>'
        +rows.map(function(r){return '<div class="brow"><span style="width:130px"><b>'+esc(r.block)+'</b></span><span style="flex:1">'+esc(r.note)+'</span><span style="width:150px;font-size:11px" class="muted">'+esc(r.where)+'</span><span style="width:90px;font-size:11px" class="muted">'+dm(r.at)+'</span></div>';}).join('')+'</div>';
    });
  };
  $('ngo').onclick=run;
  $('nq').addEventListener('keydown',function(ev){if(ev.key==='Enter')run();});
  run();
}

function setPane(h){var pane=$('bh-pane');var sheet=$('bh-sheet');pane.innerHTML=h;pane.appendChild(sheet);}
function byName(n){return DATA.filter(function(b){return b.name===n;})[0];}
function openSheet(name,tab){var b=byName(name);if(!b){/* traced block may not be in DATA */b={name:name,exp:'',block:name,L:0,W:0,H:0};}var sh=$('bh-sheet');sh.style.display='block';tab=tab||'det';
  sh.innerHTML='<div class="box"><div style="text-align:center;color:#8a929c;padding:30px">Loading&hellip;</div></div>';
  sh.onclick=function(ev){if(ev.target===sh){sh.style.display='none';}};
  post('dolphin_theme.blocks_api.block_detail',{name:name}).then(function(j){renderSheet(b,j.message||{},tab);});}
function renderSheet(b,det,tab){var sh=$('bh-sheet');
  var head='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+expHtml(b.exp,b.block)+'<span class="rb" id="bh-x">&#10005;</span></div>'
    +'<div style="display:flex;gap:2px;border-bottom:.5px solid #d6e6f5;margin-bottom:12px"><span class="stt '+(tab==='det'?'on':'')+'" data-s="det">Details</span><span class="stt '+(tab==='hist'?'on':'')+'" data-s="hist">Journey</span><span class="stt '+(tab==='note'?'on':'')+'" data-s="note">Notes'+(det.notes&&det.notes.length?(' &middot; '+det.notes.length):'')+'</span><span class="stt '+(tab==='edit'?'on':'')+'" data-s="edit">Edit</span></div>';
  var body='';
  if(tab==='det'){var ro=function(l,v){return '<div style="margin-bottom:6px"><span class="muted" style="font-size:11px">'+l+'</span><div style="font-size:13px">'+v+'</div></div>';};
    body='<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 14px">'+ro('Produced',dm(det.produced)+ageChip(null))+ro('Pit',esc(det.pit))+ro('Grade',esc(det.grade))+ro('Size',b.L+'&times;'+b.W+'&times;'+b.H)+ro('CBM',f(det.cbm,3))+ro('Gross MT',f(det.mt))+ro('Reached port',det.portd?dm(det.portd):'&mdash;')+ro('Shipped',det.shipd?dm(det.shipd):'&mdash;')+'</div>';}
  else if(tab==='hist'){var ev=[['Produced',det.produced,'#3b6d11','',null],['Quarry Inspection',det.qid,'#1d9e75',det.qi,'Quarry Inspection'],['Buyer Inspection',det.bid,'#185fa5',det.bi,'Buyer Inspection'],['Delivery Challan',det.dcd,'#7f77dd',det.dc,'Delivery Challan'],['Reached port',det.portd,'#3c3489','',null],['Shipped',det.shipd,'#0f6e56','',null]];
    body='<div style="position:relative;padding-left:20px">'+ev.map(function(e,i){var done=!!e[1];return '<div style="position:relative;margin-bottom:'+(i<ev.length-1?'14px':'0')+'">'+(i<ev.length-1?'<div style="position:absolute;left:-14px;top:14px;bottom:-14px;width:2px;background:#e0e6ee"></div>':'')+'<div style="position:absolute;left:-19px;top:2px;width:12px;height:12px;border-radius:50%;background:'+(done?e[2]:'#cfd4dc')+'"></div><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:600;color:'+(done?'#1f2a3a':'#8a929c')+'">'+e[0]+'</span>'+(e[3]&&e[4]?eye(e[4],e[3],e[3]):'')+'</div><div class="muted" style="font-size:11px">'+(done?dm(e[1]):'not yet')+'</div></div>';}).join('')+'</div>';}
  else if(tab==='note'){body='<div style="max-height:180px;overflow:auto;margin-bottom:10px">'+((det.notes&&det.notes.length)?det.notes.map(function(n){return '<div class="note"><div style="font-size:12px">'+esc(n.t)+'</div><div class="muted" style="font-size:10px">added '+dm(n.d)+'</div></div>';}).join(''):'<div class="muted" style="font-size:12px;padding:6px 0">No notes yet.</div>')+'</div><textarea id="bh-note" placeholder="Add a note&hellip;" style="width:100%;height:54px"></textarea><button class="rb" id="bh-addnote" style="margin-top:6px;background:#2490ef;color:#fff;border:none">Add note</button>';}
  else{var inStock=det.status==='In Stock';
    body=(inStock?'':'<div style="background:#fdf3f3;color:#a32d2d;font-size:11px;padding:7px 9px;border-radius:7px;margin-bottom:10px">Block is &lsquo;'+esc(det.status)+'&rsquo;. Saving edits will change downstream figures &mdash; tick confirm.</div>')
      +'<div style="margin-bottom:9px"><div class="muted" style="font-size:11px;margin-bottom:3px">Grade</div><input id="e-grade" value="'+esc(det.grade)+'" style="width:100%"></div>'
      +'<div style="margin-bottom:9px"><div class="muted" style="font-size:11px;margin-bottom:3px">Size L &times; W &times; H</div><div style="display:flex;gap:6px"><input id="e-L" value="'+b.L+'" style="flex:1"><input id="e-W" value="'+b.W+'" style="flex:1"><input id="e-H" value="'+b.H+'" style="flex:1"></div></div>'
      +(inStock?'':'<label style="font-size:11px;display:block;margin-bottom:9px"><input type="checkbox" id="e-force" style="width:auto"> Yes, update downstream figures</label>')
      +'<button class="rb" id="bh-save" style="background:#D4A24A;color:#4a3208;border:none;font-weight:600">Save</button>';}
  sh.innerHTML='<div class="box">'+head+body+'</div>';
  $('bh-x').onclick=function(){sh.style.display='none';};
  sh.onclick=function(ev){if(ev.target===sh){sh.style.display='none';}};
  Array.prototype.forEach.call(sh.querySelectorAll('.stt'),function(el){el.onclick=function(){renderSheet(b,det,el.dataset.s);};});
  wireEyes(sh);
  if(tab==='note'){$('bh-addnote').onclick=function(){var v=$('bh-note').value.trim();if(!v)return;post('dolphin_theme.blocks_api.add_block_note',{name:b.name,text:v}).then(function(){openSheet(b.name,'note');});};}
  if(tab==='edit'){$('bh-save').onclick=function(){var force=$('e-force')?($('e-force').checked?1:0):1;post('dolphin_theme.blocks_api.save_block_fields',{name:b.name,length:$('e-L').value,width:$('e-W').value,height:$('e-H').value,grade:$('e-grade').value,force:force}).then(function(j){if(j.message&&j.message.ok){b.L=+$('e-L').value;b.W=+$('e-W').value;b.H=+$('e-H').value;b.grade=$('e-grade').value;b.cbm=j.message.cbm;b.mt=j.message.mt;sh.style.display='none';render();}else{alert('Could not save. '+(j._server_messages||''));}});};}}

function render(){
  tabs();ctxBar();
  $('bh-flt').style.display=(ST.tab==='trace'||ST.tab==='notes')?'none':'flex';
  if(ST.tab==='trace')traceView();
  else if(ST.tab==='notes')notesView();
  else if(ST.tab==='dup')dupView();
  else if(ST.drill)drillList();
  else summary();
}

/* ---- trace box behaviour: live suggestions, Enter runs the full trace ---- */
function traceSuggest(q){
  var dd=$('bh-dd');
  if(!q||q.length<2){dd.style.display='none';return;}
  var hits=DATA.filter(function(b){return (b.block+'').indexOf(q)===0||(b.exp+'').indexOf(q)===0;}).slice(0,12);
  if(!hits.length){dd.style.display='none';return;}
  dd.innerHTML=hits.map(function(b){return '<div class="r" data-q="'+esc(b.exp||b.block)+'"><b>'+esc(b.exp||'—')+'</b> <span class="muted">quarry '+esc(b.block)+' &middot; '+esc(b.status)+'</span></div>';}).join('');
  dd.style.display='block';
  Array.prototype.forEach.call(dd.children,function(el){el.onclick=function(){$('bh-trace').value=el.dataset.q;dd.style.display='none';runTrace(el.dataset.q);};});
}
function runTrace(q){
  q=(q||'').trim(); if(!q)return;
  TQ=q;TRACE=null;ST.tab='trace';render();
  get('dolphin_theme.blocks_api.trace_all','q='+encodeURIComponent(q)).then(function(j){TRACE=j.message||{hits:[]};render();})
    .catch(function(){TRACE={hits:[],message:'Could not reach the server.'};render();});
}
$('bh-trace').addEventListener('input',function(){traceSuggest(this.value.trim());});
$('bh-trace').addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();$('bh-dd').style.display='none';runTrace(this.value);}});
document.addEventListener('click',function(ev){if(!ev.target.closest||!ev.target.closest('.tracewrap'))$('bh-dd').style.display='none';});

function load(){$('bh-pane').innerHTML='<div style="padding:40px;text-align:center;color:#8a929c">Loading blocks&hellip;</div><div class="sheet" id="bh-sheet"></div>';
  fetch('/api/method/dolphin_theme.blocks_api.blocks_hub',{credentials:'include'}).then(function(r){return r.json();}).then(function(j){DATA=j.message||[];var gsel=$('bh-grade');var gv=gsel.value;gsel.innerHTML='<option value="">all</option>'+uniq(DATA.map(function(b){return b.grade;})).filter(Boolean).map(function(g){return '<option '+(g===gv?'selected':'')+'>'+esc(g)+'</option>';}).join('');var d=new Date();$('bh-asof').textContent='as of '+('0'+d.getDate()).slice(-2)+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+d.getFullYear();render();}).catch(function(){$('bh-pane').innerHTML='<div style="padding:40px;text-align:center;color:#a32d2d">Could not load blocks (endpoint may still be deploying).</div>';});}
fetch('/api/method/dolphin_theme.api_arrivals.get_token',{credentials:'include'}).then(function(r){return r.json();}).then(function(j){TOKEN=j.message;});
['bh-grade','bh-from','bh-to','bh-mode','bh-L','bh-W','bh-H','bh-q'].forEach(function(id){var el=$(id);el.addEventListener('input',function(){ST.drill=null;render();});el.addEventListener('change',function(){ST.drill=null;render();});});
$('bh-reload').onclick=load;
/* deep link: /blocks-hub?trace=1234 opens straight on that block */
(function(){var p=new URLSearchParams(location.search);if(p.get('trace')){$('bh-trace').value=p.get('trace');setTimeout(function(){runTrace(p.get('trace'));},400);}})();
load();
</script>
